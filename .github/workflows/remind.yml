name: Remind

on:
  schedule:
    # UK 22:00 (BST) 待审提醒 → UTC 21:00, 距 23:00 结算留 1 小时。
    # 冬令时(GMT)会落在本地 21:00, 提前 1 小时, 已接受该漂移(跟 collect/finalize 一致)。
    - cron: "0 21 * * *"
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DECISIONS_API_SECRET: ${{ secrets.DECISIONS_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv sync

      # ADR 0004: state.db 不进 git, 用 cache 跨 run 滚动持久化。只读今天推过的
      # pending_reviews, 不写 db, 但沿用其它 tick 一致的 restore+save 写法。
      - name: Restore/save state.db
        uses: actions/cache@v4
        with:
          path: data/state.db
          key: state-db-${{ github.run_id }}
          restore-keys: state-db-

      - name: Run remind tick
        run: uv run python -m src.cli --tick remind
