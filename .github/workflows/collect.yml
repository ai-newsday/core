name: Collect

on:
  schedule:
    # 2026-09-03: 5x/天(每 3h)→ 8x/天(每 2h), 用户要求配合 card_pool_limit 50→100
    # 一起提高覆盖率(config/scoring.yaml)。
    # UK 07/09/11/13/15/17/19/21 (BST) → UTC 06/08/10/12/14/16/18/20。
    # Actions cron 只认 UTC; 冬令时(GMT)整体早 1 小时(本地 06:00-20:00), 已接受该漂移
    # (沿用旧 5x 排期的既有约定, 见 git blame)。
    - cron: "0 6,8,10,12,14,16,18,20 * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
      AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
      # x-extension (utils/sync.ts) writes to <repo-root>/data/x/<date>.ndjson,
      # not the repo root itself — this dir must include that data/x suffix.
      X_LIST_DATA_DIR: .cache/x-signals/data/x
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv sync

      # ADR 0004: state.db 不进 git,用 cache 跨 run 滚动持久化
      - name: Restore/save state.db
        uses: actions/cache@v4
        with:
          path: data/state.db
          key: state-db-${{ github.run_id }}
          restore-keys: state-db-

      # x-signals contains X (Twitter) list-timeline tweets pushed by the browser extension
      # (ai-newsday/x-extension). x_list adapter reads .cache/x-signals/data/x/<UTC-date>.ndjson
      # (X_LIST_DATA_DIR above). Clone failure is non-fatal — adapter yields 0 items, pipeline continues.
      - name: Fetch x-signals repo
        run: |
          git clone --depth 1 https://x-access-token:${{ secrets.X_SIGNALS_PAT }}@github.com/ai-newsday/x-signals.git .cache/x-signals || echo "x-signals clone failed; x_list will yield 0"

      - name: Run collect tick
        run: uv run python -m src.cli --tick collect
