name: Finalize (Draft)

on:
  schedule:
    # UK 23:00 (BST) 结算 → UTC 22:00。当天内容进这一份报告, 但报告**标发布日**
    # (用户在午夜之后发布, 对应北京早上八点), 因此晚上这次产出的是第二天的刊物。
    # 冬令时(GMT)会落在本地 22:00, 仍是当天, 已接受该漂移。
    # 实际启动稳定比 cron 晚约 2 小时(#186): 09-08/09/10 分别 00:27/00:18/00:17 才起。
    # 当初以为是整点排队(#159 改到 :17), 三晚实测错开分钟毫无作用。所以 cron 直接
    # 提前 2 小时, 让实际启动落在约 22:17 UTC(伦敦 23:17), 草稿约 23:35 到手。
    # 若某天 GitHub 不延迟, 会在伦敦 21:17 就跑 —— 当晚之后才点的卡不会进这一期,
    # 需要时手动补跑; 午夜前重跑仍落在同一个发布日 label(_report_date 的 18 点分界)。
    - cron: "17 20 * * *"
  workflow_dispatch:

jobs:
  finalize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
      AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
      DECISIONS_API_SECRET: ${{ secrets.DECISIONS_API_SECRET }}
      # x-extension (utils/sync.ts) writes to <repo-root>/data/x/<date>.ndjson.
      X_LIST_DATA_DIR: .cache/x-signals/data/x
    steps:
      # 用 PAT checkout: 使后续 content push 触发 pages.yml(默认 GITHUB_TOKEN 防递归不触发)
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAGES_PUSH_TOKEN }}
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv sync

      # ADR 0004: state.db 不进 git,用 cache 跨 run 滚动持久化
      - name: Restore/save state.db
        uses: actions/cache@v4
        with:
          path: data/state.db
          key: state-db-${{ github.run_id }}
          restore-keys: state-db-

      # finalize's `--tick finalize` re-runs its own fresh collect() internally
      # (src/cli.py::run_tick), so it needs the same x-signals fetch as collect.yml —
      # this is a separate job/checkout, nothing is shared from collect.yml's run.
      # Clone failure is non-fatal — adapter yields 0 items, pipeline continues.
      - name: Fetch x-signals repo
        run: |
          git clone --depth 1 https://x-access-token:${{ secrets.X_SIGNALS_PAT }}@github.com/ai-newsday/x-signals.git .cache/x-signals || echo "x-signals clone failed; x_list will yield 0"

      - name: Run finalize tick (writes content/posts/<date>.md, draft:true)
        run: uv run python -m src.cli --tick finalize

      - name: Run metrics tick (writes content/metrics/<date>.{json,png,md}, TG photo)
        continue-on-error: true
        run: uv run python -m src.cli --tick metrics

      - name: Commit draft
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore: finalize draft + metrics $(date -u +%Y-%m-%d)"
          # 这一步跑完时 master 常常已经不是 checkout 时那个了: finalize 要跑几十
          # 分钟, 期间任何一次合并都会让直推被拒。09-01/02/03 连续三天的定时运行
          # 全挂在这里(`! [rejected] master -> master (fetch first)`), 草稿之所以
          # 每天还在, 是因为每晚都有人手动补跑了一次。
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $i); rebasing onto the latest master"
            git fetch origin master
            # -X theirs: rebase 时 "theirs" 指正在重放的提交, 也就是本次跑出来的
            # 草稿。当天的报告文件可能已经被同日另一次运行推上去了(手动补跑正是
            # 这种情况), 那是同一份文件的两个生成版本, 会真冲突——生成物按"后跑
            # 的赢"处理, 而不是让整步挂掉。
            git rebase -X theirs origin/master || { git rebase --abort; exit 1; }
          done
          echo "::error::could not push the draft after 3 attempts"
          exit 1
