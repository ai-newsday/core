# 故事线合并层配置(spec 2026-08-28)。同一模型/产品当天的多条独立发布(原始发布 +
# 第三方支持公告)在发布渲染层合并成一条, 不再各占一个 genre 配额位。
enabled: true

# entity token 正则: >=3 字母前缀 + 必须的连字符/空格分隔符 + 带小数点的版本号。
# 覆盖 "GLM-5.3" 这类"名称+连字符/空格+点分版本号"模式。
# 已知代价: 不匹配纯整数版本号的名称, 如 "Llama 4"。
# 真实 50 条 pool 实测: 加紧后当日候选对从 8(全是噪音)降到 0, 只留 GLM-5.3 这一个跨 item token。
entity_token_pattern: '\b[A-Za-z]{3,}[-\s]\d+(?:\.\d+)+\b'

providers:
  modelscope:
    base_url: "https://api-inference.modelscope.cn/v1/chat/completions"
    api_key_env: "MODELSCOPE_API_KEY"

models:
  - "modelscope:deepseek-ai/DeepSeek-V4-Flash"

fallback_models:
  - "modelscope:Qwen/Qwen3.5-397B-A17B"

temperature: 0.0
max_tokens: 200
timeout_s: 30
summary_max_chars: 500
prompt_path: "src/prompts/story_link_confirm.md"
