# 打分排序层配置 (Circle 3). 全部维度分/权重/配额可调, 不写死在代码里.
# genre → 4 维内容价值 (一手性/技术价值/产业影响/扩散潜力). 机构影响力由 publisher 提供.
genre_value:
  paper:        {一手性: 20, 技术价值: 16, 产业影响: 8,  扩散潜力: 7}
  model:        {一手性: 18, 技术价值: 14, 产业影响: 12, 扩散潜力: 9}
  announcement: {一手性: 20, 技术价值: 10, 产业影响: 16, 扩散潜力: 12}
  writeup:      {一手性: 12, 技术价值: 12, 产业影响: 8,  扩散潜力: 9}
  news:         {一手性: 8,  技术价值: 6,  产业影响: 12, 扩散潜力: 11}

# publisher → 机构影响力 (单标量, b1). priority_bonus 仍叠加其上.
publisher_authority: {lab: 18, company: 14, individual: 8, media: 12}

# registry 中 source.priority (1=最高) → 折进"机构影响力"维度
priority_bonus: {1: 6, 2: 3, 3: 0, 4: -2, 5: -4}
priority_bonus_default: 0

recency:                          # 时效分 (spec §5.2). 晨报报昨天: 放宽让昨天一整天算新鲜, 按质量排而非按几点发
  fresh_hours: 30
  fresh_bonus: 10
  mid_hours: 48
  mid_bonus: 4
  stale_hours: 60
  stale_penalty: -10

# 读者偏好话题: 标题/摘要命中关键词 → 读者相关度 bonus
topic_boost:
  keywords:
    - unified generation
    - image editing
    - multimodal
    - agent
    - image generation
    - video generation
    - diffusion
    - vision-language
    - 统一生成
    - 图像编辑
    - 多模态
    - 智能体
  bonus: 5

penalty:
  same_source: -5                 # 同源第2+条各扣 (spec §5.3)
  firehose: -20                   # 信号闸: 个人+零人气的 model/writeup 扣分(压 gemma 类噪声)
  uncertain_content: -15          # body 自我保留("未披露/需后续验证")或信息稀薄时扣分, 不再无区分拿满分

# "可见指标" = sum(weight * sqrt(signals[key]))  → cap (spec §5.1 PRD §5.5 该维度的接入)
# - hf-papers.upvotes 范围常见 0-300 → sqrt 后 0-17, 大头都在 5-12
# - hf-models.likes 范围 0-1000+ → sqrt 后 0-30, 极值有但少
# - hn_points 范围 0-1000+ → sqrt 后 0-30, AI 圈中位数 5-50
# - 权重 0.5 让 sqrt(100)=10 → 5 分, sqrt(900)=30 → 15 (近 cap)
popularity_weights: {upvotes: 0.6, hn_points: 0.5, likes: 0.3, num_comments: 0.4, release_tier_score: 1.0, x_favorite: 0.4, x_retweet: 0.5, x_quote: 0.3}
# x_reply 不计入: 回复数更多反映争议度而非质量, 加进来会奖励吵架贴而不是好内容.
# release_tier_score: judge_release_importance() 写入的 tier 分值(2/3 档), 直接用不加权(该维度本身已是策展分值, 不是原始人气数字)
# github_stars 2026-07-25 移出此维度: 它是仓库固定星数, 不随具体某次 release 变化——
# 同一仓库连续几个补丁版本 github_stars 完全相同, 任何 >~2500 星的仓库 0.3*sqrt(stars)
# 就已经把可见指标顶满 15 分封顶, 真正该衡量"这次发布是否重要"的 release_tier_score
# 反而被盖过, 导致补丁版本和真大版本一样顶到满分。star 数留给 priority(机构影响力)体现。
popularity_cap: 15.0              # 单条最高 +15 分, 防异常超大数值

# 发卡候选池: score 排序后取 top-N 进 interpret(发卡)。比旧 quota→top-11 宽,
# 让低分相关首发也能发卡被 keep。也是 collect tick 每天推 Telegram 审阅卡片的条数上限
# (不只是 interpret 成本上界)。25→50(2026-07-19): 实测同日 322 条候选只有 25 条(8%)
# 进发卡池, 明显欠采样; 50 条兼顾覆盖率与人工审阅量。
# per-genre 配额 + total_limit 已移到 config/publish.yaml(人 keep 后施加)。
card_pool_limit: 50

sources_registry_path: "config/sources.yaml"

# 机构影响力按 adapter 打折(2026-07-24 实测): 一条推文不等于一篇官方博客/论文的机构
# 背书分量, 但两者共用同一套 genre_value+publisher_authority 固定分(company/priority1
# = 20 + announcement 矩阵 58 = 78), 加上时效 10 + 关键词 5 就到 93, 只剩 7 分给可见指标
# 区分冷门/爆款推文 —— 实测 99 分 vs 100 分, 分不出好坏。x_list 直接把机构影响力清零,
# 把区分度让给可见指标/时效/关键词。
adapter_authority_factor: {x_list: 0.0}

# 同源惩罚豁免(spec §5.3 例外): X 账号一天报多条不同大新闻是常态, 不是同一博客灌水
# 占坑——同事件重复已由 dedup 聚类挡掉, 这里的"同源"只是"同账号", 惩罚发得多的账号
# 跟内容质量无关(2026-07-25 实测: fchollet/testingcatalog 这类活跃账号被 -5 压分)。
same_source_penalty_exempt_adapters: [x_list]
