# 解读生成层配置 (Circle 4). 模型参数/字段约束全部可调, 不写死.

# Provider registry: keys are provider name prefixes used in model refs below.
providers:
  modelscope:
    base_url: "https://api-inference.modelscope.cn/v1/chat/completions"
    api_key_env: "MODELSCOPE_API_KEY"
  agnes:
    base_url: "https://apihub.agnes-ai.com/v1/chat/completions"
    api_key_env: "AGNES_API_KEY"

# 主模型链。2026-08-30: agnes 提到首位。ModelScope 在生产上已 100% 不可用
# (当天 collect run 实测 chat/completions 153 次请求 0 次成功, 全部 429; embeddings
# 同样 429), 而 429 是按账号限流不是按模型——原来 4 个 ModelScope 主模型 + 3 个备用
# 共用同一个额度, 一挂全挂, 每条目要先撞 7 次必死请求才轮到 agnes。agnes 同期 49 次
# 调用全部 HTTP 200, 实际是它一个人在扛整条流水线。ModelScope 保留在后面, 额度恢复
# 后自动重新参与, 不用改配置。
models:
  - "agnes:agnes-2.0-flash"
  - "modelscope:deepseek-ai/DeepSeek-V4-Pro"
  - "modelscope:inclusionAI/Ring-2.6-1T"
  - "modelscope:deepseek-ai/DeepSeek-V4-Flash"
  - "modelscope:inclusionAI/Ling-2.6-1T"

# 备用模型链 (前 3 家 2026-07-11 未探活, 生产表现见分晓; agnes 是付费保险丝)
fallback_models:
  - "modelscope:moonshotai/Kimi-K2.6"
  - "modelscope:moonshotai/Kimi-K2.5"
  - "modelscope:Qwen/Qwen3.5-397B-A17B"
  - "agnes:agnes-2.0-flash"

# 每条解读是一次独立的 LLM 往返。顺序跑 100 条发卡池实测 40-60 分钟
# (2026-09-03/04), 并发只压墙钟时间, 调用次数与成本不变。
# 往上调之前先看 429: 供应商按账号限流, 打太猛会把 fallback 率顶回去。
concurrency: 4

temperature: 0.3
# 2026-08-30: 1500 → 4000。agnes 是推理模型, reasoning_tokens 计入 max_tokens 且
# 波动极大(同一条 prompt 实测 600 / 695 / 1127)。1500 的预算里推理已占 66%
# (782 推理 vs 406 正文), 推理一旦冲高就在写完 JSON 前撞顶——这正是线上
# "returned empty content"(推理吃光, text_tokens=0)和 "Unterminated string"
# (正文写一半被截)两种失败的同一个根因。实测 max_tokens=800 时 finish=length、
# reasoning_tokens=800、正文 0 字。
# 2026-09-01: 4000 → 8000。线上仍有条目报 "produced no content within
# max_tokens=4000"(当天 3 条回退里 2 条是它), 说明推理预算在某些输入上还会烧穿。
max_tokens: 8000
timeout_s: 60
title_max_chars: 64
body_max_chars: 240
raw_summary_max_chars: 1500          # 防任意 adapter 的超长 raw_summary(如 GitHub release body)撑爆 prompt
tags_count: 3
min_evidence: 1
item_prompt_path: "src/prompts/interpret_item.md"
daily_prompt_path: "src/prompts/daily_take.md"
