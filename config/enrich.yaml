enabled: true
concurrency: 5
timeout_s: 8
# 这些 genre 已经带原生 popularity 信号, 不再查 HN
skip_genres: [paper, model]

# github_releases 重要性判定 (2026-07-22 设计, docs/superpowers/specs/2026-07-22-github-release-importance-design.md)
# LLM 判 4 个独立布尔维度(scale/refactor/new_concept/bugfix_only), 纯函数映射成 tier(0-3)。
# tier <= hard_filter_max_tier 直接从候选池剔除; tier >= 2 写 release_tier_score 参与打分。
release_importance:
  enabled: true
  providers:
    modelscope:
      base_url: "https://api-inference.modelscope.cn/v1/chat/completions"
      api_key_env: "MODELSCOPE_API_KEY"
    agnes:
      base_url: "https://apihub.agnes-ai.com/v1/chat/completions"
      api_key_env: "AGNES_API_KEY"
  # 2026-08-11: 原链(DeepSeek-V4-Flash 主 + Kimi-K2.6 备)在 ModelScope 上已双双下线
  # ("has no provider supported"), release_importance 一直 fail-open 到 tier=2,
  # 从没真正判定过。**"活着"不等于"能用"**: 换过 Step-3.7-Flash/Intern-S1-Pro
  # (不遵守 JSON 输出约束), 又换过 DeepSeek-V4-Pro 当主力(简单 curl 测试正常),
  # 结果拿真实 release body 跑 12 次调用, DeepSeek-V4-Pro 100% 失败(空内容 /
  # NoneType), 只有 Qwen3.5-397B-A17B 稳定产出合法 JSON 且 tier 判定有真实区分度
  # (非全部 fail-open 成同一档)。所以 Qwen3.5-397B-A17B 才是主力, DeepSeek-V4-Pro
  # 反而不放进这条链(放进来只会拖慢, 不会兜底成功)。
  models:
    - "modelscope:Qwen/Qwen3.5-397B-A17B"
  fallback_models:
    - "agnes:agnes-2.5-flash"
  temperature: 0.1        # 分类任务, 低温度求稳定
  # 2026-08-12: max_tokens=300 时真实数据里出现过 JSON 被截断(Unterminated string),
  # 提示词只要求 4 布尔 + 一句话 reason, 但真实 reason 常超预估长度, 留够余量。
  max_tokens: 500
  # 2026-08-12: 30s 超时下真实 release body 的判定几乎全部 ReadTimeout, 又 fail-open
  # 回 tier=2, 等于白测。interpret 主链同一 API 用 60s 稳定跑, 分类任务没理由更快, 对齐。
  timeout_s: 60
  empty_body_min_chars: 30 # 去掉 Full Changelog 链接后正文短于此 -> 短路判 tier 0, 不调 LLM
  hard_filter_max_tier: 1  # tier <= 1 (空转/常规补丁) 从候选池剔除
  tier_score: {2: 4, 3: 9} # tier -> release_tier_score(写入 popularity_weights, sqrt+cap 压缩)
  prompt_path: "src/prompts/release_importance.md"

# hf-models 条目补描述文本: adapter 本身只调模型列表 API, 没有正文可用 (2026-07-27,
# 实锤 microsoft/Mage-Flow 发布时 body 是空的, 但 HF 上其实有真实 README)。
# 抓每个候选模型的 README, 清洗 frontmatter/图片/HTML 后当 raw_summary 素材;
# 抓不到或清洗后太短的条目直接从候选列表剔除, 不让空 body 进审阅卡池。
hf_readme:
  enabled: true
  timeout_s: 8
  concurrency: 5
  min_body_chars: 80  # 占位值, Task 5 用真实数据核实后可能调整
  max_body_chars: 2500  # 2026-07-27 真实数据核实: 不封顶会把 10k+ 字符的 README 带进 dedup embedding

# 逐条配图(spec 2026-08-31-per-item-images-design)。只对最终发布条目跑(由
# tick.py 在 build_report() 之后调用), 不对发卡池全量跑。
item_image:
  enabled: true
  timeout_s: 8
  concurrency: 5
  skip_adapters: ["github_releases", "github_trending"]  # 自动生成的仓库卡片, 留白更好
  allow_news_media: false  # 新闻站 og:image 是有版权的新闻摄影, 默认不取(风险类问题)
  news_media_adapters: []  # allow_news_media=true 时才生效的白名单
  max_bytes: 2000000  # 实测 arXiv 图有到 1.6MB 的
